# Machine has 3.88 GB total RAM. Requesting more than the OS can commit causes the
# JVM to abort with "Native memory allocation (mmap) failed" (see hs_err_pid*.log).
# Keep the Gradle daemon well under ~1.6 GB of committed memory.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -Xss512k -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx640m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Xss512k

# Compile Kotlin inside the Gradle daemon instead of forking a third JVM.
# This app has a single 5-line Kotlin file, so the saving is worth it.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# 4-core CPU with 3.88 GB RAM: serialise work to cap peak memory.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.vfs.watch=false

# Jetifier rewrites every dependency on the classpath and is a large memory cost.
# Flutter never needed it; AndroidX artifacts are used directly.
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
